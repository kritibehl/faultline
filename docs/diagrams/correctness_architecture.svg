<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 600 13px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="50" y="55" class="title">Faultline Correctness Architecture</text>

  <rect x="45" y="125" width="180" height="115" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="83" y="160" class="box-title">Worker Claim</text>
  <text x="70" y="190" class="body">Select available job</text>
  <text x="70" y="213" class="body">Acquire ownership row</text>

  <rect x="285" y="125" width="180" height="115" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="160" class="box-title">Lease Issuance</text>
  <text x="310" y="190" class="body">Set lease deadline</text>
  <text x="310" y="213" class="body">Record worker owner</text>

  <rect x="525" y="125" width="180" height="115" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="555" y="160" class="box-title">Fencing Token</text>
  <text x="550" y="190" class="body">Monotonic token</text>
  <text x="550" y="213" class="body">Changes on takeover</text>

  <rect x="765" y="125" width="180" height="115" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="798" y="160" class="box-title">Commit Validation</text>
  <text x="790" y="190" class="body">Compare current token</text>
  <text x="790" y="213" class="body">Reject stale owners</text>

  <rect x="1005" y="125" width="220" height="115" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1035" y="160" class="box-title">Transactional Commit</text>
  <text x="1030" y="190" class="body">Job result + outbox event</text>
  <text x="1030" y="213" class="body">Persisted atomically</text>

  <line x1="225" y1="182" x2="285" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="465" y1="182" x2="525" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="705" y1="182" x2="765" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="945" y1="182" x2="1005" y2="182" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="265" y="350" width="300" height="145" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="325" y="390" class="box-title">Transactional Outbox</text>
  <text x="305" y="425" class="body">Event written in the same transaction</text>
  <text x="305" y="451" class="body">as the accepted job-state transition</text>

  <rect x="715" y="350" width="300" height="145" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="390" class="box-title">Duplicate Suppression</text>
  <text x="755" y="425" class="body">Unique idempotency key</text>
  <text x="755" y="451" class="body">Repeated delivery becomes a no-op</text>

  <line x1="1115" y1="240" x2="1115" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="1115" y1="300" x2="415" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="415" y1="300" x2="415" y2="350" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="565" y1="422" x2="715" y2="422" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="408" class="label">publish and deliver</text>

  <rect x="255" y="575" width="770" height="85" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="315" y="610" class="box-title">Tested invariants</text>
  <text x="315" y="640" class="body">
    stale commit rejected · one accepted commit · no lost outbox event · repeated effect suppressed
  </text>
</svg>
