<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .lane { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .step { font: 600 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .token { font: 700 14px Arial, sans-serif; fill: #ffffff; }
      .pass { font: 700 17px Arial, sans-serif; fill: #166534; }
      .reject { font: 700 17px Arial, sans-serif; fill: #991b1b; }
    </style>
  </defs>

  <rect width="1100" height="720" fill="#f8fafc"/>

  <text x="55" y="55" class="title">Deterministic Stale-Worker Race</text>
  <text x="55" y="82" class="subtitle">
    Fencing-token validation prevents a former lease owner from committing after takeover.
  </text>

  <rect x="60" y="120" width="250" height="540" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="425" y="120" width="250" height="540" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <rect x="790" y="120" width="250" height="540" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>

  <text x="135" y="160" class="lane">Worker A</text>
  <text x="485" y="160" class="lane">Database</text>
  <text x="865" y="160" class="lane">Worker B</text>

  <line x1="185" y1="185" x2="185" y2="625" stroke="#94a3b8" stroke-width="2"/>
  <line x1="550" y1="185" x2="550" y2="625" stroke="#94a3b8" stroke-width="2"/>
  <line x1="915" y1="185" x2="915" y2="625" stroke="#94a3b8" stroke-width="2"/>

  <text x="85" y="220" class="step">1. Claim lease</text>
  <line x1="210" y1="230" x2="520" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="275" y="197" width="90" height="28" rx="14" fill="#0284c7"/>
  <text x="293" y="216" class="token">token 7</text>

  <text x="458" y="285" class="step">2. Lease expires</text>
  <text x="455" y="308" class="small">Worker A is no longer the owner</text>

  <text x="820" y="360" class="step">3. Reclaim lease</text>
  <line x1="890" y1="370" x2="580" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="705" y="337" width="90" height="28" rx="14" fill="#059669"/>
  <text x="723" y="356" class="token">token 8</text>

  <text x="85" y="445" class="step">4. Attempt commit</text>
  <line x1="210" y1="455" x2="520" y2="455" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="440" class="small">presents stale token 7</text>

  <rect x="455" y="485" width="190" height="72" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="518" class="reject">COMMIT REJECTED</text>
  <text x="475" y="542" class="small">7 does not equal current token 8</text>

  <text x="810" y="600" class="pass">Current owner may commit</text>
  <text x="825" y="625" class="small">Duplicate commit remains impossible</text>
</svg>
