name: Faultline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: CLI smoke test
        run: |
          faultline --help
          faultline test --help
          faultline compare --help

      - name: Framework regression tests
        run: |
          python -m pytest tests -q
